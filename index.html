<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,#0f0c29,#302b63,#24243e);color:#fff;min-height:100vh;padding:env(safe-area-inset-top) 14px 40px}
h1{font-size:30px;margin:18px 0 4px;background:linear-gradient(90deg,#f093fb,#4facfe,#38ef7d);-webkit-background-clip:text;color:transparent}
.up{color:#9fe8ff;font-size:13px;margin-bottom:14px}
.need{background:linear-gradient(135deg,#f5576c,#f7b733);border-radius:18px;padding:14px 16px;margin-bottom:16px;box-shadow:0 8px 24px #f5576c55}
.need b{font-size:18px}.need li{margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.c{position:relative;overflow:hidden;border-radius:20px;padding:16px;color:#fff;text-decoration:none;display:block;box-shadow:0 10px 26px #0006}
.c:after{content:"";position:absolute;top:-60%;left:-60%;width:60%;height:220%;background:linear-gradient(90deg,transparent,#fff4,transparent);transform:rotate(20deg);animation:sh 4s infinite}
@keyframes sh{0%{left:-60%}60%,100%{left:140%}}
.g{background:linear-gradient(135deg,#11998e,#38ef7d)}.a{background:linear-gradient(135deg,#f7971e,#f7b733)}.r{background:linear-gradient(135deg,#eb3349,#f5576c)}
.n{font-weight:700;font-size:16px}.big{font-size:38px;font-weight:800;margin:6px 0}.s{font-size:14px;opacity:.95}.nd{margin-top:8px;font-weight:700;background:#0003;border-radius:10px;padding:6px 8px;font-size:13px}.as{font-size:12px;opacity:.85;margin-top:8px}
#login{max-width:340px;margin:30vh auto 0;text-align:center}input,button{width:100%;padding:14px;border-radius:14px;border:0;font-size:17px;margin-top:10px}button{background:linear-gradient(90deg,#f093fb,#4facfe);color:#fff;font-weight:700}
label{font-size:14px;display:block;margin-top:10px}label input{width:auto}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;position:sticky;top:0;z-index:5;background:#1b1838e6}.tabs button{width:auto;white-space:nowrap;padding:9px 14px;font-size:14px;margin:0;background:#ffffff1f}.tabs button.on{background:linear-gradient(90deg,#f093fb,#4facfe)}
.p{background:#ffffff14;border-radius:18px;padding:14px;margin:12px 0}.p h3{margin:0 0 8px;font-size:16px}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.kp .c{padding:12px}.kp .big{font-size:24px}
.ch{position:relative;height:240px}.nc{opacity:.9;font-style:italic}.lbl{font-size:11px;opacity:.75}table{width:100%;border-collapse:collapse;font-size:13px}td{padding:5px 3px;border-bottom:1px solid #fff2;vertical-align:top}
.ab{background:linear-gradient(90deg,#11998e,#38ef7d);font-size:14px;padding:11px;text-align:left}textarea{width:100%;border-radius:14px;padding:12px;font-size:15px;margin-top:8px;border:0}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#38ef7d;color:#000;padding:12px 18px;border-radius:14px;font-weight:700;display:none;z-index:9}

function chart(id,type,labels,sets,opt){const el=document.getElementById(id);if(!el||!window.Chart)return;CH.push(new Chart(el,{type,data:{labels,datasets:sets},options:Object.assign({responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#fff'}}},scales:type=='pie'||type=='doughnut'?{}:{x:{ticks:{color:'#fff'}},y:{ticks:{color:'#fff'}}}},opt||{})}))}
function actions(biz,list,k){return `<div class="p"><h3>⚡ Actions</h3>${list.map(x=>`<button class="ab" onclick='act(${JSON.stringify(biz)},${JSON.stringify(x)})'>${esc(x)}</button>`).join('')}<textarea id="ft${k}" rows="2" placeholder="Tell Stephanie something else about ${esc(biz)}…"></textarea><button onclick='actFree(${JSON.stringify(biz)},"ft${k}")'>Copy instruction</button></div>`}
function tab(i){CH.forEach(c=>c.destroy());CH=[];document.querySelectorAll('.tabs button').forEach((b,j)=>b.classList.toggle('on',j==i));const F=D.fin,v=document.getElementById('view');
if(i==0){const wr=F.biz.filter(b=>rv(b)!=null),R=wr.reduce((a,b)=>a+rv(b),0),C=F.biz.reduce((a,b)=>a+(cs(b)||0),0);const cat={};F.biz.forEach(b=>b.costs.items.forEach(x=>cat[x.cat]=(cat[x.cat]||0)+x.amt));
v.innerHTML=`<div class="kp"><div class="c g"><div class="n">Revenue (connected)</div><div class="big">${$(R)}</div><div class="lbl">${wr.length} of ${F.biz.length} businesses</div></div><div class="c a"><div class="n">Known costs</div><div class="big">${$(C)}</div><div class="lbl">partial – see gaps</div></div><div class="c ${R-C>=0?'g':'r'}"><div class="n">Profit (known)</div><div class="big">${$(R-C)}</div><div class="lbl">ROI ${C?Math.round((R-C)/C*100)+'%':'n/a'}</div></div></div><div class="lbl">Period: ${esc(F.period)} · data pulled ${esc(F.pulled)}</div>
<div class="p"><h3>Income by business</h3><div class="ch"><canvas id="c1"></canvas></div></div><div class="p"><h3>Outgoings by category (known)</h3><div class="ch"><canvas id="c2"></canvas></div></div><div class="p"><h3>Revenue vs known cost per business</h3><div class="ch"><canvas id="c3"></canvas></div></div>
<div class="p"><h3>Subscriptions</h3><table>${F.subs.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.status)}${s.asof?`<div class="lbl">${esc(s.src||'')} · ${esc(s.asof)}</div>`:''}</td></tr>`).join('')}</table></div>
<div class="p"><h3>⚠️ Not connected / gaps</h3><ul>${F.gaps.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></div>`+
(D.needs.length?`<div class="need"><b>Needs you</b><ul>${D.needs.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`:'')+actions('Portfolio',F.portfolio_actions,0)+
`<div class="p"><h3>Status cards</h3><div class="grid">${D.biz.map(b=>`<${b.link?'a href="'+esc(b.link)+'" target="_blank"':'div'} class="c ${b.c}"><div class="n">${esc(b.n)}${b.link?' ↗':''}</div><div class="big">${esc(b.big)}</div><div class="s">${esc(b.sub)}</div>${b.need?`<div class="nd">Needs you: ${esc(b.need)}</div>`:''}<div class="as">As of ${esc(b.asof)}</div></${b.link?'a':'div'}>`).join('')}</div></div>`;
chart('c1','pie',wr.map(b=>b.n),[{data:wr.map(rv),backgroundColor:PAL}]);chart('c2','pie',Object.keys(cat),[{data:Object.values(cat),backgroundColor:PAL.slice(3)}]);
chart('c3','bar',wr.map(b=>b.n),[{label:'Revenue',data:wr.map(rv),backgroundColor:'#38ef7d'},{label:'Known cost',data:wr.map(b=>cs(b)||0),backgroundColor:'#f5576c'}]);return}
const b=F.biz[i-1],R=rv(b),C=cs(b);let h=`<div class="kp"><div class="c ${R!=null?'g':'a'}"><div class="n">Revenue</div><div class="big">${R!=null?$(R):'Not connected'}</div><div class="lbl">${R!=null?`${b.rev.orders} orders · ${esc(b.rev.src)}<br>${esc(b.rev.period)} · ${esc(b.rev.asof)}`:esc(b.rev.nc)}</div></div>
<div class="c ${C!=null?'a':'a'}"><div class="n">Costs${b.costs.partial?' (partial)':''}</div><div class="big">${C!=null?$(C):'Not connected'}</div><div class="lbl">Missing: ${esc(b.costs.missing.join(', '))}</div></div>
<div class="c ${R!=null&&C!=null?(R-C>=0?'g':'r'):'a'}"><div class="n">Profit / ROI</div><div class="big">${R!=null&&C!=null?$(R-C):'—'}</div><div class="lbl">${R!=null&&C?'ROI '+Math.round((R-C)/C*100)+'% on known costs':'Needs revenue + costs'}</div></div></div>`;
if(b.notes)h+=`<div class="lbl">${esc(b.notes)}</div>`;
if(R!=null&&Object.keys(b.rev.by_source).length)h+=`<div class="p"><h3>Income by source</h3><div class="ch"><canvas id="d1"></canvas></div></div>`;
if(C)h+=`<div class="p"><h3>Outgoings by category</h3><div class="ch"><canvas id="d2"></canvas></div><table>${b.costs.items.map(x=>`<tr><td>${esc(x.cat)}</td><td>${$(x.amt)}</td><td class="lbl">${esc(x.src)} · ${esc(x.period||'')} · ${esc(x.asof)}</td></tr>`).join('')}</table></div>`;
if(R!=null&&Object.keys(b.rev.weekly).length)h+=`<div class="p"><h3>Weekly revenue${b.rev.cost_weekly?' vs ad spend':''}</h3><div class="ch"><canvas id="d3"></canvas></div><div class="lbl">Weeks starting Monday</div></div>`;
v.innerHTML=h+actions(b.n,b.actions,i);
if(R!=null){const s=b.rev.by_source;chart('d1','pie',Object.keys(s),[{data:Object.values(s),backgroundColor:PAL}]);const wk=Object.keys(b.rev.weekly);const sets=[{type:'bar',label:'Revenue',data:wk.map(k=>b.rev.weekly[k]),backgroundColor:'#38ef7d'}];if(b.rev.cost_weekly)sets.push({type:'line',label:'Ad spend',data:wk.map(k=>b.rev.cost_weekly[k]||0),borderColor:'#f5576c',backgroundColor:'#f5576c'});chart('d3','bar',wk,sets)}
if(C){const cat={};b.costs.items.forEach(x=>cat[x.cat]=(cat[x.cat]||0)+x.amt);chart('d2','pie',Object.keys(cat),[{data:Object.values(cat),backgroundColor:PAL.slice(3)}])}}
function show(d){D=d;document.getElementById('login').hidden=true;const a=document.getElementById('app');a.hidden=false;
a.innerHTML=`<h1>Damien HQ</h1><div class="up">Updated ${esc(d.updated)} · refreshes every 30 min, 6am–midnight · <a href="#" style="color:#9fe8ff" onclick="localStorage.removeItem('dmhq_p');location.reload()">Log out</a></div>`+
(d.fin?`<div class="tabs">${['Portfolio'].concat(d.fin.biz.map(b=>b.n)).map((n,i)=>`<button onclick="tab(${i})">${esc(n)}</button>`).join('')}</div><div id="view"></div>`:'<div id="view">Finance data missing</div>');if(d.fin)tab(0)}
const sp=localStorage.getItem('dmhq_p');if(sp){document.getElementById('p').value=sp;go()}
document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
</script></body></html>
